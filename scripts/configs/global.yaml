db_root: ./experiments
selection_metric: "Recall@10"
# Split used to choose configs (n-gram order, which run becomes `best`).
# Never data.split: selecting on the reported split biases the numbers.
# Falls back to `train`; datasets with neither get no selection at all.
selection_split: dev
